<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — The Westlands School</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Navigation Menu Bar */
    nav {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.25rem 2rem;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    nav a {
      text-decoration: none;
      color: #e2e8f0;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: #60a5fa;
      color: #ffffff;
    }

    /* Main Content Wrapper */
    .main-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem 2rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
      background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Rectangular Google Map Box */
    .map-box {
      width: 100%;
      height: 300px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      margin-bottom: 2rem;
    }

    .map-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Contact Details */
    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      text-align: left;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 1.5rem 1.75rem;
    }

    .detail-item {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .detail-item strong {
      color: #93c5fd;
      display: inline-block;
      margin-right: 0.4rem;
    }

    .detail-item a {
      color: #f8fafc;
      text-decoration: none;
      border-bottom: 1px dashed rgba(96, 165, 250, 0.6);
      transition: color 0.2s ease;
    }

    .detail-item a:hover {
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <!-- Menu Bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="contact.html" class="active">Contact Us</a>
  </nav>

  <!-- Centered Content -->
  <div class="main-wrapper">
    <main class="container">
      <h1>Contact Us</h1>

      <!-- Rectangular Google Map Box -->
      <div class="map-box">
        <iframe
          title="Map showing The Westlands School, Sittingbourne"
          src="https://maps.google.com/maps?q=The%20Westlands%20School,%20Westlands%20Avenue,%20Sittingbourne,%20Kent,%20ME10%201PF&t=&z=15&ie=UTF8&iwloc=&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

      <!-- Contact Details -->
      <div class="contact-details">
        <p class="detail-item">
          <strong>School Telephone:</strong>
          <a href="tel:01795477475">01795 477475</a>
        </p>
        <p class="detail-item">
          <strong>Address:</strong>
          The Westlands School, Westlands Avenue, Sittingbourne, Kent, ME10 1PF
        </p>
      </div>
    </main>
  </div>
</body>
</html>
